
    <header class="app-header">
      <div class="app-header__container">
        <!-- Zona Esquerda: Brand -->
        <div class="app-header__brand">
          <a routerLink="/" class="brand-link">
            <div class="brand-logo">
              <!-- Ícone Angular simplificado (placeholder) -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 22H22L12 2Z" fill="var(--color-accent-primary)" stroke="var(--color-accent-primary)" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="brand-text">Learn Angular 21</span>
          </a>
        </div>

        <!-- Zona Central: Navegação -->
        <nav class="app-header__nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
                Início
              </a>
            </li>
            <li class="nav-item">
              <a 
                routerLink="/trilhas" 
                routerLinkActive="active" 
                [class.active-parent]="isLicaoRoute()"
                class="nav-link"
              >
                Trilhas
              </a>
            </li>
            <li class="nav-item">
              <a routerLink="/minhas-licoes" routerLinkActive="active" class="nav-link">
                Minhas lições
              </a>
            </li>
          </ul>
        </nav>

        <!-- Zona Direita: Ações -->
        <div class="app-header__actions">
          <button 
            class="theme-toggle" 
            (click)="toggleTheme()" 
            [title]="'Tema atual: ' + themeService.currentTheme()"
            aria-label="Alternar tema"
          >
            <!-- Ícone Sol (Light) -->
            @if (themeService.currentTheme() === 'sandstone') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            }
            
            <!-- Ícone Lua (Dark/Midnight) -->
            @if (themeService.currentTheme() !== 'sandstone') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            }
          </button>

          <div class="user-avatar">
            <span>U</span>
          </div>
        </div>
      </div>
    </header>
