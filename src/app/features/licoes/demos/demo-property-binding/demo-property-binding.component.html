
    <div class="demo-property">
      <div class="editor-side">
        <div class="side-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <h4>Editor</h4>
        </div>
        
        <div class="control-group">
          <label>Cor de fundo:</label>
          <div class="color-options">
            @for (cor of cores; track cor.valor) {
              <button 
                class="color-btn"
                [class.selected]="corSelecionada() === cor.valor"
                [style.background]="cor.valor"
                (click)="corSelecionada.set(cor.valor)"
              >
                {{ cor.nome }}
              </button>
            }
          </div>
        </div>

        <div class="control-group">
          <label>Tamanho do texto: {{ tamanhoTexto() }}px</label>
          <input 
            type="range" 
            class="slider"
            [ngModel]="tamanhoTexto()"
            (ngModelChange)="tamanhoTexto.set($event)"
            min="12"
            max="32"
          />
        </div>

        <div class="code-hint">
          <code>[style.background]="cor"</code>
          <code>[style.fontSize.px]="tamanho"</code>
        </div>
      </div>

      <div class="divider"></div>

      <div class="preview-side">
        <div class="side-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <h4>Preview</h4>
        </div>

        <div 
          class="preview-box"
          [style.background]="corSelecionada()"
          [style.fontSize.px]="tamanhoTexto()"
        >
          Property Binding em ação!
        </div>

        <div class="info-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Os colchetes <code>[prop]</code> vinculam propriedades do elemento a valores do componente.</span>
        </div>
      </div>
    </div>
